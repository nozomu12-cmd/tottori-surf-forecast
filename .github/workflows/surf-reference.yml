name: Refresh surf reference
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: surf-reference
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public reference forecasts
        id: fetch
        continue-on-error: true
        run: node tools/update-surf-reference.mjs
      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/surf-reference.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report partial failure
        if: steps.fetch.outcome == 'failure'
        run: exit 1
